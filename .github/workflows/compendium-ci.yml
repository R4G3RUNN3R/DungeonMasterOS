name: Compendium CI

on:
  push:
    branches: [feature/master-item-compendium]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Compendium typecheck
        run: npx tsc --noEmit -p tsconfig.compendium.json
      - name: Production build
        run: npm run build
      - name: Full repository typecheck baseline
        continue-on-error: true
        run: npm run typecheck

name: Campaign Library CI

on:
  push:
    branches:
      - research/campaign-template-library
    paths:
      - 'research/campaign-library/**'
      - 'scripts/validate_campaign_library.py'
      - '.github/workflows/campaign-library-ci.yml'
  pull_request:
    paths:
      - 'research/campaign-library/**'
      - 'scripts/validate_campaign_library.py'
      - '.github/workflows/campaign-library-ci.yml'
  workflow_dispatch:

jobs:
  validate-campaign-library:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator
        run: python -m pip install --disable-pip-version-check jsonschema
      - name: Validate campaign library
        run: python scripts/validate_campaign_library.py
